name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create required Tauri icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(15, 17, 22))
          $blue = [System.Drawing.Color]::FromArgb(79, 140, 255)
          $green = [System.Drawing.Color]::FromArgb(47, 191, 113)
          $pen = New-Object System.Drawing.Pen($blue, 8)
          $graphics.DrawRectangle($pen, 12, 12, 232, 232)
          $brush = New-Object System.Drawing.SolidBrush($green)
          $graphics.FillRectangle($brush, 52, 140, 28, 58)
          $graphics.FillRectangle($brush, 110, 92, 28, 106)
          $graphics.FillRectangle($brush, 168, 52, 28, 146)
          $font = New-Object System.Drawing.Font('Arial', 26, [System.Drawing.FontStyle]::Bold)
          $whiteBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
          $graphics.DrawString('TJ', $font, $whiteBrush, 83, 205)
          $icon = [System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $stream = New-Object System.IO.FileStream("src-tauri/icons/icon.ico", [System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Close()
          $graphics.Dispose()
          $bitmap.Dispose()

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
